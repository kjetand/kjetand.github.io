<svg class="logo__mark" viewBox="0 0 240 132" role="img" aria-label="A midnight sun shaped like a vinyl record, resting over Arctic mountains">
  <defs>
    <linearGradient id="logo-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf63"/>
      <stop offset=".5" stop-color="#e0a526"/>
      <stop offset="1" stop-color="#c2492a"/>
    </linearGradient>
    <clipPath id="logo-sky"><rect x="0" y="0" width="240" height="96"/></clipPath>
  </defs>

  <!-- rays -->
  <g stroke="#e0a526" stroke-width="3" stroke-linecap="round">
    <line x1="59.4" y1="65.1" x2="46.6" y2="62.4"/>
    <line x1="63.8" y1="51.8" x2="52.0" y2="46.3"/>
    <line x1="71.1" y1="39.8" x2="60.9" y2="31.8"/>
    <line x1="81.0" y1="29.8" x2="72.8" y2="19.7"/>
    <line x1="92.8" y1="22.3" x2="87.1" y2="10.6"/>
    <line x1="106.1" y1="17.6" x2="103.1" y2="4.9"/>
    <line x1="120.0" y1="16.0" x2="120.0" y2="3.0"/>
    <line x1="133.9" y1="17.6" x2="136.9" y2="4.9"/>
    <line x1="147.2" y1="22.3" x2="152.9" y2="10.6"/>
    <line x1="159.0" y1="29.8" x2="167.2" y2="19.7"/>
    <line x1="168.9" y1="39.8" x2="179.1" y2="31.8"/>
    <line x1="176.2" y1="51.8" x2="188.0" y2="46.3"/>
    <line x1="180.6" y1="65.1" x2="193.4" y2="62.4"/>
  </g>

  <!-- the sun / record, sitting on the horizon -->
  <g clip-path="url(#logo-sky)">
    <circle cx="120" cy="78" r="54" fill="url(#logo-sun)"/>
    <g fill="none" stroke="#1c1915" stroke-opacity=".28" stroke-width="1.3">
      <circle cx="120" cy="78" r="48"/>
      <circle cx="120" cy="78" r="42"/>
      <circle cx="120" cy="78" r="36"/>
      <circle cx="120" cy="78" r="29"/>
    </g>
    <circle cx="120" cy="78" r="17" fill="#1c1915"/>
    <circle cx="120" cy="78" r="12.5" fill="none" stroke="#e0a526" stroke-width="1.2"/>
    <circle cx="120" cy="78" r="2.6" fill="#e0a526"/>
    <!-- retro sunset stripes -->
    <rect x="60" y="83" width="120" height="2.6" fill="#1c1915"/>
    <rect x="60" y="88.5" width="120" height="3.4" fill="#1c1915"/>
  </g>

  <!-- Arctic peaks -->
  <path d="M18 96 L52 74 L64 82 L86 56 L101 72 L112 66 L128 86 L148 60 L166 80 L178 72 L222 96 Z"
        fill="#1c1915" stroke="#fbf5e6" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M86 56 L80 63 L86 61 L92 64 Z M148 60 L142 67 L148 65 L154 68 Z" fill="#fbf5e6"/>

  <!-- horizon + reflection on the fjord -->
  <line x1="6" y1="96" x2="234" y2="96" stroke="#fbf5e6" stroke-width="2"/>
  <g stroke-linecap="round" stroke-width="3">
    <line x1="74" y1="104" x2="166" y2="104" stroke="#e0a526"/>
    <line x1="88" y1="111" x2="152" y2="111" stroke="#e0a526" stroke-opacity=".8"/>
    <line x1="101" y1="118" x2="139" y2="118" stroke="#c2492a" stroke-opacity=".9"/>
    <line x1="112" y1="125" x2="128" y2="125" stroke="#c2492a" stroke-opacity=".7"/>
  </g>
</svg>
